prev">← Previous</button><button id="known">✓ I know it</button><button id="missed">✕ Review later</button><button id="next">Next →</button></div><p id="score" aria-live="polite"></p></main><script>const VOCAB={"NETWORK SECURITY & ARCHITECTURE":[{"term":"802.1X","def":"Authenticates devices or users before network access."},{"term":"AAA","def":"Authentication, authorization, and accounting of access."},{"term":"ABAC","def":"Grants access based on attributes and context."},{"term":"ACL","def":"Rules allowing or denying access to resources."},{"term":"ARP","def":"Finds a device’s MAC address from its IP address."},{"term":"ARP spoofing","def":"Sends fake ARP messages to redirect traffic."},{"term":"BGP","def":"Routes internet traffic between autonomous networks."},{"term":"BGP hijacking","def":"Redirects internet traffic using false routing announcements."},{"term":"Broadcast domain","def":"Devices that receive the same network broadcast."},{"term":"CASB","def":"Enforces security policies for cloud application use."},{"term":"CDN","def":"Delivers content through geographically distributed servers."},{"term":"CIA triad","def":"Confidentiality, integrity, and availability."},{"term":"Cloud firewall","def":"Filters network traffic for cloud resources."},{"term":"Defense in depth","def":"Uses multiple layers of security controls."},{"term":"DHCP","def":"Automatically assigns IP addresses and network settings."},{"term":"DHCP snooping","def":"Blocks untrusted DHCP responses on switches."},{"term":"DLP","def":"Detects or blocks unauthorized sensitive-data movement."},{"term":"DMZ","def":"Isolated network zone for public-facing systems."},{"term":"DNS","def":"Translates domain names into IP addresses."},{"term":"DNS poisoning","def":"Corrupts DNS answers to misdirect users."},{"term":"DNSSEC","def":"Verifies DNS answers have not been tampered with."},{"term":"DoH","def":"Encrypts DNS queries using HTTPS."},{"term":"DoS","def":"Overwhelms a service to make it unavailable."},{"term":"DDoS","def":"Uses many systems to overwhelm a target."},{"term":"East-west traffic","def":"Traffic moving between internal systems."},{"term":"Egress filtering","def":"Controls traffic leaving a network."},{"term":"Evil twin","def":"Fake Wi-Fi access point impersonating a trusted one."},{"term":"Firewall","def":"Allows or blocks traffic based on security rules."},{"term":"Host-based firewall","def":"Filters traffic entering or leaving one device."},{"term":"HIDS","def":"Detects suspicious activity on one device."},{"term":"HIPS","def":"Detects and blocks threats on one device."},{"term":"Honeypot","def":"Decoy system designed to attract attackers."},{"term":"Honeynet","def":"Network of decoy systems used to study attacks."},{"term":"IDS","def":"Detects suspicious activity and sends alerts."},{"term":"Inline IPS","def":"Blocks malicious traffic as it passes through."},{"term":"Ingress filtering","def":"Controls traffic entering a network."},{"term":"IPS","def":"Detects and automatically blocks suspicious activity."},{"term":"IPsec","def":"Encrypts and authenticates traffic at the IP layer."},{"term":"IPv4","def":"Internet addressing using 32-bit addresses."},{"term":"IPv6","def":"Internet addressing using 128-bit addresses."},{"term":"Jump box","def":"Hardened system used to access sensitive networks."},{"term":"LAN","def":"Network connecting devices in a small area."},{"term":"Load balancer","def":"Distributes requests across multiple servers."},{"term":"MAC address","def":"Hardware identifier assigned to a network interface."},{"term":"Microsegmentation","def":"Restricts traffic between individual workloads."},{"term":"NAC","def":"Checks devices before allowing network access."},{"term":"NAT","def":"Translates private and public IP addresses."},{"term":"NDR","def":"Detects and responds to suspicious network behavior."},{"term":"NGFW","def":"Firewall that understands applications and advanced threats."},{"term":"NIDS","def":"Detects suspicious traffic on a network."},{"term":"NIPS","def":"Detects and blocks suspicious network traffic."},{"term":"North-south traffic","def":"Traffic entering or leaving an internal network."},{"term":"OSI model","def":"Seven-layer framework for network communication."},{"term":"Packet filtering","def":"Allows or drops packets using basic rules."},{"term":"Port security","def":"Limits which devices can connect to switch ports."},{"term":"Proxy server","def":"Intermediary that forwards client requests."},{"term":"RADIUS","def":"Central server protocol for network access authentication."},{"term":"Reverse proxy","def":"Receives requests on behalf of backend servers."},{"term":"Rogue access point","def":"Unauthorized wireless access point."},{"term":"Router","def":"Directs packets between different networks."},{"term":"SASE","def":"Combines networking and cloud-delivered security."},{"term":"SDN","def":"Controls networks through centrally managed software."},{"term":"Security group","def":"Cloud rules governing resource network traffic."},{"term":"Segmentation","def":"Divides a network into smaller protected zones."},{"term":"SIEM","def":"Collects and correlates security logs and alerts."},{"term":"SOAR","def":"Automates security investigations and responses."},{"term":"SSH","def":"Encrypted remote command-line connection."},{"term":"Stateful firewall","def":"Tracks connections when deciding what to allow."},{"term":"Stateless firewall","def":"Filters individual packets without tracking sessions."},{"term":"Switch","def":"Connects devices within the same network."},{"term":"TACACS+","def":"Centralized authentication for network device administration."},{"term":"TLS","def":"Encrypts communication between applications."},{"term":"UTM","def":"Single device combining several security functions."},{"term":"VLAN","def":"Logical separation of devices on a switched network."},{"term":"VLAN hopping","def":"Attack crossing into a different VLAN."},{"term":"VPN","def":"Encrypted tunnel over an untrusted network."},{"term":"WAF","def":"Protects web applications from malicious HTTP requests."},{"term":"WIPS","def":"Detects and blocks wireless threats and rogue access points."},{"term":"Wireless IDS","def":"Detects suspicious wireless activity and alerts."},{"term":"Zero Trust","def":"Verifies every access request; trusts none automatically."},{"term":"ZTNA","def":"Provides identity-based access to specific applications."}],"IDENTITY, ACCESS & AUTHENTICATION":[{"term":"Access control","def":"Limits who can use systems and information."},{"term":"Accounting","def":"Records user activity and resource access."},{"term":"Authentication","def":"Checks whether someone is who they claim."},{"term":"Authorization","def":"Decides what an authenticated user may do."},{"term":"Biometrics","def":"Uses physical traits to verify identity."},{"term":"Certificate-based authentication","def":"Proves identity using digital certificates."},{"term":"Credential stuffing","def":"Tries stolen username-password pairs on accounts."},{"term":"DAC","def":"Resource owners decide who gets access."},{"term":"EAP","def":"Framework supporting different network authentication methods."},{"term":"EAP-TLS","def":"Uses certificates for mutual network authentication."},{"term":"Federation","def":"Allows identities to work across separate organizations."},{"term":"FIDO2","def":"Phishing-resistant sign-in using public-key cryptography."},{"term":"Identity provider (IdP)","def":"Service that verifies and issues identity claims."},{"term":"JIT access","def":"Grants elevated privileges only when needed."},{"term":"Kerberos","def":"Uses trusted tickets to authenticate network users."},{"term":"LDAP","def":"Protocol used to query directory services."},{"term":"Least privilege","def":"Give only the permissions a task requires."},{"term":"MAC (mandatory access control)","def":"System enforces access based on security labels."},{"term":"MFA","def":"Requires multiple different authentication factors."},{"term":"OAuth 2.0","def":"Lets apps receive limited delegated access."},{"term":"OIDC","def":"Adds user identity information on top of OAuth."},{"term":"PAM","def":"Controls and monitors powerful administrator accounts."},{"term":"Password spraying","def":"Tries a few common passwords across many accounts."},{"term":"PBAC (policy-based access control)","def":"Uses policies to decide who gets access."},{"term":"PKI","def":"System that issues and manages digital certificates."},{"term":"Principle of separation of duties","def":"Splits sensitive tasks among different people."},{"term":"RBAC","def":"Grants permissions based on assigned roles."},{"term":"RADIUS server","def":"Checks credentials for network access requests."},{"term":"SAML","def":"Exchanges authentication information between trusted services."},{"term":"Single sign-on (SSO)","def":"One login grants access to multiple services."},{"term":"Supplicant","def":"Device or client requesting 802.1X network access."},{"term":"Authenticator","def":"Switch or access point enforcing 802.1X authentication."},{"term":"TOTP","def":"Temporary login code based on current time."},{"term":"Zero standing privilege","def":"No permanent administrator-level access."}],"CRYPTOGRAPHY & DATA PROTECTION":[{"term":"AES","def":"Fast symmetric encryption for protecting data."},{"term":"AES-GCM","def":"Encrypts data and checks its integrity together."},{"term":"Asymmetric encryption","def":"Uses a public key and private key."},{"term":"Block cipher","def":"Encrypts fixed-size blocks of data."},{"term":"CBC","def":"Block-encryption mode chaining each block to the previous one."},{"term":"Certificate authority (CA)","def":"Trusted organization that issues digital certificates."},{"term":"Certificate pinning","def":"Accepts only expected certificates or public keys."},{"term":"Checksum","def":"Short value used to detect accidental changes."},{"term":"Ciphertext","def":"Data after encryption makes it unreadable."},{"term":"Confidentiality","def":"Keeps information from unauthorized people."},{"term":"CRL","def":"List of certificates that have been revoked."},{"term":"Cryptographic hash","def":"Fixed-length fingerprint of information."},{"term":"CTR","def":"Encryption mode using incrementing counters."},{"term":"Data at rest","def":"Information stored on disks or other media."},{"term":"Data in transit","def":"Information moving between devices or services."},{"term":"Data in use","def":"Information currently being processed."},{"term":"Digital certificate","def":"Document linking an identity to a public key."},{"term":"Digital signature","def":"Proves signer authenticity and data integrity."},{"term":"ECC","def":"Public-key cryptography using elliptic curves."},{"term":"ECDHE","def":"Temporary key agreement supporting forward secrecy."},{"term":"ECB","def":"Block mode that can reveal repeated patterns."},{"term":"Encryption","def":"Turns readable data into unreadable ciphertext."},{"term":"Entropy","def":"Amount of randomness in secret values."},{"term":"Forward secrecy","def":"Protects old sessions if a long-term key leaks."},{"term":"Full-disk encryption","def":"Encrypts data on an entire storage drive."},{"term":"Hashing","def":"Creates a one-way fingerprint of data."},{"term":"HMAC","def":"Verifies message integrity using a secret key."},{"term":"HSM","def":"Dedicated hardware protecting cryptographic keys."},{"term":"Integrity","def":"Keeps data accurate and protected from changes."},{"term":"IV","def":"Starting value used by some encryption modes."},{"term":"Key escrow","def":"Stores encryption keys for authorized recovery."},{"term":"Key rotation","def":"Replaces cryptographic keys on a schedule or trigger."},{"term":"Key stretching","def":"Makes password guessing more expensive."},{"term":"Masking","def":"Hides part or all of sensitive information."},{"term":"Nonce","def":"Number used once in a cryptographic operation."},{"term":"OCSP","def":"Checks whether a digital certificate is revoked."},{"term":"PBKDF2","def":"Password-based function that deliberately slows guessing."},{"term":"Plaintext","def":"Readable data before encryption."},{"term":"Private key","def":"Secret part of an asymmetric key pair."},{"term":"Public key","def":"Shareable part of an asymmetric key pair."},{"term":"RSA","def":"Public-key algorithm used in encryption and signatures."},{"term":"Salt","def":"Unique random value added before password hashing."},{"term":"SHA-256","def":"Produces a 256-bit cryptographic hash."},{"term":"Symmetric encryption","def":"Uses the same secret key to encrypt and decrypt."},{"term":"Tokenization","def":"Replaces sensitive data with a substitute value."},{"term":"TPM","def":"Security chip used to protect keys and measurements."}],"RISK, GOVERNANCE & COMPLIANCE":[{"term":"Accept risk","def":"Keep a risk with informed approval."},{"term":"ALE","def":"Expected money lost from a risk each year."},{"term":"ARO","def":"Estimated number of times an event happens annually."},{"term":"Asset","def":"Anything valuable that needs protection."},{"term":"Asset inventory","def":"List of systems, software, and owned technology."},{"term":"Avoid risk","def":"Stop the activity creating the risk."},{"term":"BIA","def":"Identifies critical operations and outage impacts."},{"term":"Business continuity","def":"Keeps essential services operating during disruption."},{"term":"COBIT","def":"Framework aligning IT governance with business goals."},{"term":"Compliance","def":"Following applicable laws, standards, and requirements."},{"term":"Control","def":"Safeguard that reduces security risk."},{"term":"Control gap","def":"Missing or ineffective required security protection."},{"term":"Corrective control","def":"Helps fix damage after an incident."},{"term":"Detective control","def":"Identifies suspicious or unwanted activity."},{"term":"Due care","def":"Taking reasonable steps to protect assets."},{"term":"Due diligence","def":"Researching and checking risks before decisions."},{"term":"EF (exposure factor)","def":"Percentage of asset value lost in one event."},{"term":"GRC","def":"Governance, risk, and compliance management."},{"term":"Guideline","def":"Recommended practice that is usually optional."},{"term":"Inherent risk","def":"Risk level before security controls."},{"term":"ISO 27001","def":"Standard for managing information security."},{"term":"ITIL","def":"Practices for managing and improving IT services."},{"term":"KPI","def":"Metric showing performance against a goal."},{"term":"KRI","def":"Metric signaling growing or changing risk."},{"term":"Mitigate risk","def":"Apply controls to reduce risk."},{"term":"NIST CSF","def":"Framework for organizing cybersecurity outcomes."},{"term":"NIST SP 800-53","def":"Catalog of security and privacy controls."},{"term":"PCI DSS","def":"Security requirements for payment card data."},{"term":"Policy","def":"High-level rule expressing leadership requirements."},{"term":"Preventive control","def":"Stops or reduces attacks before they happen."},{"term":"Procedure","def":"Step-by-step instructions to follow a policy."},{"term":"Qualitative risk assessment","def":"Rates risks using descriptions such as high or low."},{"term":"Quantitative risk assessment","def":"Estimates risk using numerical values."},{"term":"RACI","def":"Identifies responsible, accountable, consulted, and informed people."},{"term":"Residual risk","def":"Risk remaining after controls are applied."},{"term":"Risk appetite","def":"Overall amount of risk an organization will accept."},{"term":"Risk assessment","def":"Estimates threats, weaknesses, likelihood, and impact."},{"term":"Risk register","def":"Tracked list of risks, owners, and responses."},{"term":"Risk tolerance","def":"Allowed variation from risk objectives."},{"term":"SLE","def":"Expected financial loss from one incident."},{"term":"Standard","def":"Specific mandatory requirement to be followed."},{"term":"Third-party risk","def":"Risk introduced by vendors or partners."},{"term":"Transfer risk","def":"Shift some risk impact through contracts or insurance."},{"term":"Threat","def":"Anything that could cause harm to assets."},{"term":"Vulnerability","def":"Weakness that an attacker could exploit."}],"BUSINESS CONTINUITY & DISASTER RECOVERY":[{"term":"3-2-1 backup","def":"Three copies, two media types, one offsite."},{"term":"Active-active","def":"Multiple systems handle work simultaneously."},{"term":"Active-passive","def":"Standby system takes over when primary fails."},{"term":"Backup","def":"Saved copy used to restore lost data."},{"term":"Cold site","def":"Basic replacement location requiring substantial setup."},{"term":"Differential backup","def":"Copies changes since the last full backup."},{"term":"Disaster recovery","def":"Restores systems after major disruption."},{"term":"Failover","def":"Switches service to a backup system."},{"term":"Full backup","def":"Copies all selected data."},{"term":"High availability","def":"Keeps services running despite component failures."},{"term":"Hot site","def":"Ready-to-use recovery facility with running infrastructure."},{"term":"Immutable backup","def":"Copy that cannot be altered during retention."},{"term":"Incremental backup","def":"Copies changes since the last backup."},{"term":"MTBF","def":"Average operating time between equipment failures."},{"term":"MTTR","def":"Average time required to repair a failure."},{"term":"RPO","def":"Maximum acceptable data loss measured in time."},{"term":"RTO","def":"Maximum time allowed to restore a service."},{"term":"Snapshot","def":"Captures a system’s state at a point in time."},{"term":"Warm site","def":"Partially ready recovery location requiring some setup."}],"THREATS, ATTACKS & VULNERABILITIES":[{"term":"APT","def":"Well-resourced attacker maintaining long-term access."},{"term":"Attack surface","def":"All ways an attacker might enter a system."},{"term":"Backdoor","def":"Hidden way to bypass normal access controls."},{"term":"Botnet","def":"Group of compromised devices controlled by an attacker."},{"term":"Brute force","def":"Attempts many passwords until one works."},{"term":"Buffer overflow","def":"Writing beyond allocated memory boundaries."},{"term":"Clickjacking","def":"Tricks users into clicking hidden page elements."},{"term":"Command injection","def":"Makes an application run unauthorized system commands."},{"term":"CSRF","def":"Tricks a logged-in user’s browser into unwanted actions."},{"term":"CVE","def":"Public identifier for a known vulnerability."},{"term":"CVSS","def":"System that scores vulnerability severity."},{"term":"CPE","def":"Standardized naming of affected technology products."},{"term":"Directory traversal","def":"Accesses files outside an intended directory."},{"term":"Drive-by download","def":"Malware installed through a malicious website visit."},{"term":"Eavesdropping","def":"Secretly listening to communication."},{"term":"Evil twin attack","def":"Fake Wi-Fi network impersonating a real one."},{"term":"Exploit","def":"Code or technique that abuses a vulnerability."},{"term":"Fileless malware","def":"Malware operating mainly through memory or trusted tools."},{"term":"Fuzzing","def":"Feeds unexpected inputs to discover software flaws."},{"term":"Hacktivist","def":"Attacker motivated by a social or political cause."},{"term":"Insider threat","def":"Risk created by someone with internal access."},{"term":"IOC","def":"Evidence suggesting a system was compromised."},{"term":"IOA","def":"Behavior suggesting an attack is occurring."},{"term":"Lateral movement","def":"Attackers move between systems after entry."},{"term":"Man-in-the-middle","def":"Attacker intercepts communication between parties."},{"term":"MITRE ATT&CK","def":"Knowledge base of attacker tactics and techniques."},{"term":"OSINT","def":"Intelligence gathered from public sources."},{"term":"Patch","def":"Software update that fixes issues or vulnerabilities."},{"term":"Persistence","def":"Attacker technique for keeping access after reboot."},{"term":"Phishing","def":"Fraudulent message trying to steal information or access."},{"term":"Pivoting","def":"Using one compromised machine to reach others."},{"term":"Privilege escalation","def":"Gaining permissions beyond those originally granted."},{"term":"Ransomware","def":"Malware that blocks or encrypts data for payment."},{"term":"Rootkit","def":"Malware designed to hide privileged access."},{"term":"Session hijacking","def":"Takes control of an existing authenticated session."},{"term":"Smishing","def":"Phishing delivered by SMS text message."},{"term":"Social engineering","def":"Manipulates people into revealing information or acting."},{"term":"Spear phishing","def":"Phishing targeted at a specific person or group."},{"term":"SQL injection","def":"Injects malicious SQL through unsafe application input."},{"term":"SSRF","def":"Tricks a server into making unwanted requests."},{"term":"Supply chain attack","def":"Compromises vendors or dependencies to reach targets."},{"term":"Threat actor","def":"Person or group carrying out malicious activity."},{"term":"Threat hunting","def":"Proactively searches systems for hidden attackers."},{"term":"Trojan","def":"Malicious program disguised as legitimate software."},{"term":"Vishing","def":"Phishing conducted through voice calls."},{"term":"Watering hole","def":"Compromises websites frequently visited by targets."},{"term":"Whaling","def":"Phishing aimed at high-ranking executives."},{"term":"Worm","def":"Malware that spreads itself across systems."},{"term":"XSS","def":"Injects script that runs in another user's browser."},{"term":"Zero-day","def":"Vulnerability exploited before a fix is available."}],"ENDPOINTS, CLOUD & SOFTWARE ENGINEERING":[{"term":"Application allowlisting","def":"Runs only approved software."},{"term":"Application hardening","def":"Removes unnecessary features and risky settings."},{"term":"Attack surface reduction","def":"Limits entry points attackers could use."},{"term":"CI/CD","def":"Automates software building, testing, and delivery."},{"term":"Cloud elasticity","def":"Adds or removes computing resources as needed."},{"term":"Cloud shared responsibility","def":"Provider and customer share security duties."},{"term":"CMDB","def":"Database of IT assets and their relationships."},{"term":"Container","def":"Isolated environment packaging an application."},{"term":"DAST","def":"Tests a running application for weaknesses."},{"term":"DevSecOps","def":"Builds security into development and operations."},{"term":"Docker","def":"Platform used to package and run containers."},{"term":"EDR","def":"Monitors endpoints and supports investigation and response."},{"term":"Endpoint","def":"Individual device connected to an organization’s systems."},{"term":"Hypervisor","def":"Software that creates and manages virtual machines."},{"term":"IaaS","def":"Cloud provider supplies infrastructure; customer manages systems."},{"term":"IaC","def":"Defines computing infrastructure through code."},{"term":"IaC scanning","def":"Checks infrastructure code for insecure settings."},{"term":"Image","def":"Saved template used to create systems or containers."},{"term":"Kubernetes","def":"Coordinates deployment and operation of containers."},{"term":"Least functionality","def":"Disables services and features not required."},{"term":"Legacy system","def":"Older technology difficult to update or replace."},{"term":"PaaS","def":"Cloud provider manages the application platform."},{"term":"Patch management","def":"Tracks, tests, and deploys software fixes."},{"term":"Public cloud","def":"Shared provider infrastructure available to customers."},{"term":"Private cloud","def":"Cloud environment dedicated to one organization."},{"term":"Hybrid cloud","def":"Combines private and public cloud resources."},{"term":"SaaS","def":"Cloud provider runs software accessed by users."},{"term":"SAST","def":"Examines code without running the application."},{"term":"SCA","def":"Finds vulnerable third-party software dependencies."},{"term":"SBOM","def":"Inventory of software components and dependencies."},{"term":"Secure boot","def":"Checks trusted boot components before loading them."},{"term":"Measured boot","def":"Records startup integrity measurements for verification."},{"term":"Security baseline","def":"Approved minimum security configuration."},{"term":"Sandbox","def":"Isolated environment for running or testing software."},{"term":"Threat modeling","def":"Identifies likely threats early in system design."},{"term":"VM escape","def":"Breaks out of a virtual machine’s isolation."},{"term":"VM hopping","def":"Moves from one virtual machine to another."},{"term":"Virtual machine","def":"Software-based computer running on a host."},{"term":"Virtualization","def":"Runs multiple isolated virtual systems on hardware."}],"INCIDENT RESPONSE & FORENSICS":[{"term":"Acquisition","def":"Collecting an evidence copy for analysis."},{"term":"Alert triage","def":"Sorting alerts by urgency and credibility."},{"term":"Chain of custody","def":"Record showing who handled evidence and when."},{"term":"Containment","def":"Stops an incident from spreading or worsening."},{"term":"Disk imaging","def":"Creates a forensic copy of storage media."},{"term":"Eradication","def":"Removes attacker tools and causes of compromise."},{"term":"Event log","def":"Record of system or security activity."},{"term":"False negative","def":"Real threat that a detector misses."},{"term":"False positive","def":"Safe activity incorrectly flagged as malicious."},{"term":"File carving","def":"Recovers files from raw data by patterns."},{"term":"File integrity monitoring","def":"Detects changes to important files."},{"term":"Forensic image","def":"Preserved copy of data for investigation."},{"term":"Incident response","def":"Process to detect, contain, and recover from attacks."},{"term":"Lessons learned","def":"Review of what worked and what should improve."},{"term":"Live forensics","def":"Collects evidence while the system remains running."},{"term":"Memory dump","def":"Saved contents of a device's RAM."},{"term":"Order of volatility","def":"Collect most easily lost evidence first."},{"term":"Playbook","def":"Documented steps for handling a specific incident."},{"term":"Recovery","def":"Restores safe systems and services after an incident."},{"term":"Root cause analysis","def":"Determines why an incident happened."},{"term":"Volatile evidence","def":"Data that disappears when power is lost."}]};let deck=[],n=0,flipped=false,known=new Set(),missed=new Set(),audio=true;const $=id=>document.getElementById(id),keys=Object.keys(VOCAB);$('category').innerHTML='<option value="all">All categories (335 cards)</option>'+keys.map((k,i)=>'<option value="'+i+'">'+k+'</option>').join('');function tone(good){if(!audio)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.type=good?'sine':'triangle';o.frequency.value=good?700:220;o.connect(v);v.connect(a.destination);v.gain.setValueAtTime(.07,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.22);o.start();o.stop(a.currentTime+.23)}catch(e){}}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function build(){const v=$('category').value;deck=shuffle((v==='all'?Object.values(VOCAB).flat():VOCAB[keys[+v]]).slice());n=0;flipped=false;show()}function show(){let c=deck[n];if(!c)return;$('face').textContent=flipped?c.def:c.term;$('hint').textContent=flipped?'Definition • tap to see term':'Concept • tap to reveal';$('stats').textContent='Card '+(n+1)+' / '+deck.length;$('score').textContent='✓ Known '+known.size+' • Review '+missed.size}function flip(){flipped=!flipped;tone(true);show()}$('card').onclick=flip;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};function move(d){n=(n+d+deck.length)%deck.length;flipped=false;show()}$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('known').onclick=()=>{known.add(deck[n].term);missed.delete(deck[n].term);tone(true);move(1)};$('missed').onclick=()=>{missed.add(deck[n].term);known.delete(deck[n].term);tone(false);move(1)};$('music').onclick=()=>{audio=!audio;$('music').textContent=audio?'🔊 Sound ON':'🔇 Sound OFF'};$('category').onchange=build;$('shuffle').onclick=build;for(let i=0;i<14;i++){let d=document.createElement('span');d.className='ghost';d.textContent=i%2?'✦':'👻';d.style.left=(i*17%100)+'%';d.style.animationDelay=(-i*1.2)+'s';document.body.appendChild(d)}build();</script></body></html>
