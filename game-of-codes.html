<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game of Codes | SecurityX</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#422b1b,#0b0910 76%);color:#f8e5b9;font:17px Georgia,serif}main{max-width:850px;padding:28px 16px 65px;margin:auto;text-align:center}a{color:#f9d99e}h1{font-size:clamp(45px,8vw,83px);line-height:1;text-shadow:0 0 26px #d28c3a;color:#f6c36e;margin-bottom:5px}.subtitle{letter-spacing:.16em}.panel{margin:25px auto;padding:25px;background:linear-gradient(#4a3024,#1d1717);border:9px ridge #ae8556;box-shadow:0 0 24px #cf873955;text-align:left}.story{font-size:21px;line-height:1.55}.choice{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0;padding:14px;border:3px ridge #947046;background:#30231e;color:#ffe3ad;font:17px Georgia;text-align:left;cursor:pointer}.choice[aria-pressed=true]{border-color:#ffe783;background:#675029}.choice:disabled{opacity:.85;cursor:default}button.action{padding:13px 25px;margin:12px 5px;background:linear-gradient(#b78544,#61401b);color:#fff5da;font:800 18px Georgia;border:3px ridge #e8bb72;cursor:pointer}#result{font-size:20px;line-height:1.4;min-height:45px}#progress{color:#e8bd79}input{accent-color:#eebd6c}@media(prefers-reduced-motion:no-preference){h1{animation:shine 3s alternate infinite}@keyframes shine{to{text-shadow:0 0 40px #fff3a7,0 0 65px #f1a348}}}</style></head><body><main><a href="./index.html">⬅ RETURN TO CYBERGAMES MAIN MENU</a><h1>⚔️ GAME OF CODES</h1><p class="subtitle">WHERE SCENARIO PBQs REIGN</p><div id="progress"></div><div class="panel"><h2 id="title"></h2><p id="story" class="story"></p><p><strong>Choose TWO responses.</strong></p><div id="choices"></div><button class="action" id="submit">⚔️ Defend the Kingdom</button><div id="result" aria-live="polite"></div><button class="action" id="next" hidden>Next Quest →</button></div><p id="score"></p></main><script>const data=[{"title":"The Breached Kingdom","story":"Your SOC detects unusual outbound traffic from a finance server shortly after an unknown PowerShell process launches. Choose the first two response actions.","options":["Isolate the affected host from the network","Preserve volatile evidence and collect process/network artifacts","Reimage every server in the enterprise immediately","Delete all event logs"],"correct":[0,1],"why":"Contain the compromised host and preserve evidence. Broad reimaging and log deletion destroy investigative opportunities."},{"title":"The Cryptographic Crown","story":"An API stores sensitive session tokens in localStorage and sends them over HTTP. Select the two improvements that most directly protect token confidentiality.","options":["Require TLS for every connection","Prefer secure HttpOnly cookies where appropriate","Disable audit logging","Increase DNS TTL"],"correct":[0,1],"why":"TLS protects tokens in transit, while HttpOnly cookies can reduce exposure to script access."},{"title":"The False Banner","story":"A trusted user's account makes impossible-travel logins, then exports a large amount of customer data. Select two useful investigation steps.","options":["Review authentication events and MFA records","Correlate export activity with account/session logs","Automatically trust the activity because credentials were valid","Turn off security alerts"],"correct":[0,1],"why":"Authentication and data-access evidence help identify compromised sessions and data exposure."},{"title":"Castle Firewall","story":"A production app needs inbound HTTPS from the internet, but its database must only accept requests from the application subnet. Choose the two correct rules.","options":["Permit inbound TCP 443 to the web tier","Permit database access only from the app subnet","Expose the database port to 0.0.0.0/0","Allow every port to simplify troubleshooting"],"correct":[0,1],"why":"Segment application and data tiers with least-privilege access."},{"title":"The Backup Citadel","story":"Ransomware has encrypted shared storage and attackers have domain administrator access. Which two measures most improve recovery resilience?","options":["Use immutable or offline backups","Test restores and isolate recovery credentials","Keep backups writable using the same domain admin","Skip recovery testing"],"correct":[0,1],"why":"Offline/immutable copies and tested restores reduce risk that ransomware defeats recovery."},{"title":"The Oracle of Risk","story":"A company finds a critical internet-facing vulnerability. The patch may cause an outage. Choose the two most appropriate risk-management steps.","options":["Assess exploitation likelihood and business impact","Apply temporary mitigations and schedule a controlled patch","Ignore it because the patch has operational risk","Change the risk rating without evidence"],"correct":[0,1],"why":"Use a documented risk decision and compensating controls while coordinating remediation."}];let i=0,points=0,done=false,selected=new Set();const $=k=>document.getElementById(k);function beep(win){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.frequency.value=win?660:190;o.type=win?'sine':'sawtooth';o.connect(v);v.connect(a.destination);v.gain.setValueAtTime(.07,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.start();o.stop(a.currentTime+.31)}catch(e){}}function render(){done=false;selected.clear();let q=data[i];$('progress').textContent='QUEST '+(i+1)+' / '+data.length;$('title').textContent=q.title;$('story').textContent=q.story;$('result').textContent='';$('choices').innerHTML='';q.options.forEach((op,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+n)+'. '+op;b.setAttribute('aria-pressed','false');b.onclick=()=>{if(done)return;if(selected.has(n))selected.delete(n);else if(selected.size<2)selected.add(n);b.setAttribute('aria-pressed',selected.has(n)+'')};$('choices').append(b)});$('submit').hidden=false;$('next').hidden=true;$('score').textContent='HONOR: '+points} $('submit').onclick=()=>{if(selected.size!==2){$('result').textContent='Choose exactly two responses first.';return}if(done)return;done=true;const q=data[i],ok=q.correct.every(n=>selected.has(n));if(ok)points+=100;beep(ok);$('result').textContent=(ok?'🏆 Excellent defense! ':'⚠️ The kingdom needs another strategy. ')+q.why;[...$('choices').children].forEach((b,n)=>{b.disabled=true;if(q.correct.includes(n))b.style.borderColor='#65f7a5';else if(selected.has(n))b.style.borderColor='#ff7575'});$('submit').hidden=true;$('next').hidden=false;$('next').textContent=i===data.length-1?'Finish the Realm':'Next Quest →';$('score').textContent='HONOR: '+points};$('next').onclick=()=>{if(i<data.length-1){i++;render()}else{$('title').textContent='THE KINGDOM IS SECURE';$('story').textContent='You earned '+points+' / '+data.length*100+' honor points.';$('choices').innerHTML='';$('result').textContent='Practice complete. Revisit the scenarios and strengthen your defenses.';$('next').hidden=true;}};render();</script></body></html>
